<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name — Video Editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis2.googleapis.com/css2?family=Montserrat:ital,wght@0,200;0,400;0,700;0,900;1,200;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .section-toggle {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 0 auto 28px;
      padding: 0 20px;
    }

    .section-toggle button {
      background: transparent;
      border: 1px solid rgba(17, 17, 17, 0.5);
      color: #111;
      padding: 10px 18px;
      font: inherit;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .section-toggle button.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }

    .gallery.hidden {
      display: none;
    }

    /* Photos grid layout */
    .photos-grid {
      display: grid !important;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      grid-auto-rows: 1fr;
      gap: 16px;
      width: min(1200px, calc(100% - 32px));
      margin: 0 auto;
    }

    /* Ensure grid items don't force a single-column layout from other site styles */
    .photos-grid > .grid-item,
    .photos-grid > .photo-card {
      width: auto !important;
      display: block !important;
      margin: 0 !important;
    }

    .photo-card {
      overflow: hidden;
      background: #f3f3f3;
      border: 1px solid rgba(17, 17, 17, 0.08);
      display: block;
    }

    .photo-card .thumb {
      width: 100%;
      height: 100%;
      min-height: 160px;
    }

    .photo-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- HERO -->
  <header class="hero">
    <p class="hero-eyebrow">Video Portfolio</p>
    <h1 class="hero-name">Lada Tatarkina</h1>
  </header>

  <div class="section-toggle" aria-label="Portfolio sections">
    <button id="videosBtn" class="active" type="button" aria-selected="true">Videos</button>
    <button id="photosBtn" type="button" aria-selected="false">Photos</button>
  </div>

  <!-- GALLERY: VIDEOS -->
  <main class="gallery" id="videosSection">

    <div class="grid-item reveal">
      <div class="thumb">
        <video src="reel_04_02_1.MP4" controls playsinline muted></video>
      </div>
    </div>

    <div class="grid-item reveal">
      <div class="thumb">
        <video src="SHOW_ROOM_REEL.MP4" controls playsinline muted></video>
      </div>
    </div>

    <div class="grid-item reveal">
      <div class="thumb">
        <video src="video01.mp4" controls playsinline muted></video>
      </div>
    </div>

    <div class="grid-item reveal">
      <div class="thumb">
        <video src="video_08.mp4" controls playsinline muted></video>
      </div>
    </div>

    <div class="grid-item reveal">
      <div class="thumb">
        <video src="video03.mp4" controls playsinline muted></video>
      </div>
    </div>

    <div class="grid-item reveal">
      <div class="thumb">
        <video src="cups_reel_21_03.MP4" controls playsinline muted></video>
      </div>
    </div>

    <div class="grid-item reveal">
      <div class="thumb">
        <video src="video04.mp4" controls playsinline muted></video>
      </div>
    </div>

    <div class="grid-item reveal">
      <div class="thumb">
        <video src="concert_recap.mp4" controls playsinline muted></video>
      </div>
    </div>

    <div class="grid-item reveal">
      <div class="thumb">
        <video src="video10.mp4" controls playsinline muted></video>
      </div>
    </div>

  </main>

  <!-- GALLERY: PHOTOS -->
  <main class="gallery hidden" id="photosSection" aria-live="polite">
    <div id="photosGrid" class="photos-grid"></div>
  </main>

  <!-- CONTACT -->
  <footer class="contact" id="contact">
    <div class="contact-inner">
      <p class="contact-label">Get in touch</p>
      <h2 class="contact-big">Say Hello ↗</h2>
      <div class="contact-links">
        <a href="mailto:your@email.com">Email</a>
        <a href="https://linkedin.com/in/yourprofile" target="_blank">LinkedIn</a>
        <a href="https://vimeo.com/yourprofile" target="_blank">Vimeo</a>
      </div>
    </div>
    <p class="footer-copy">© 2025 Your Name</p>
  </footer>

  <script>
    const videosBtn = document.getElementById('videosBtn');
    const photosBtn = document.getElementById('photosBtn');
    const videosSection = document.getElementById('videosSection');
    const photosSection = document.getElementById('photosSection');

    function showVideos() {
      videosSection.classList.remove('hidden');
      photosSection.classList.add('hidden');
      videosBtn.classList.add('active');
      photosBtn.classList.remove('active');
      videosBtn.setAttribute('aria-selected', 'true');
      photosBtn.setAttribute('aria-selected', 'false');
    }

    function showPhotos() {
      videosSection.classList.add('hidden');
      photosSection.classList.remove('hidden');
      photosBtn.classList.add('active');
      videosBtn.classList.remove('active');
      photosBtn.setAttribute('aria-selected', 'true');
      videosBtn.setAttribute('aria-selected', 'false');
    }

    videosBtn.addEventListener('click', showVideos);
    photosBtn.addEventListener('click', showPhotos);

    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          obs.unobserve(e.target);
        }
      });
    }, { threshold: 0.05 });
    document.querySelectorAll('.reveal').forEach(el => obs.observe(el));

    async function listRepoFiles(path = '') {
      const repoOwner = 'ladachka';
      const repoName = 'video-portfolio';
      const url = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${path}`;

      try {
        const res = await fetch(url);
        if (!res.ok) return [];

        const items = await res.json();
        let files = [];

        for (const item of items) {
          if (item.type === 'file' && /\.(jpe?g|png)$/i.test(item.name)) {
            files.push(item);
          } else if (item.type === 'dir') {
            const nested = await listRepoFiles(item.path);
            files = files.concat(nested);
          }
        }

        return files;
      } catch (error) {
        console.warn('Unable to load image files from repository:', error);
        return [];
      }
    }

    async function loadPhotos() {
      const photosGrid = document.getElementById('photosGrid');
      if (!photosGrid) return;

      const files = await listRepoFiles();

      if (!files.length) {
        photosGrid.innerHTML = '<p style="grid-column: 1 / -1; text-align: center;">No JPG/PNG photos were found in the repository yet.</p>';
        return;
      }

      const sortedFiles = files.sort((a, b) => a.name.localeCompare(b.name));

      sortedFiles.forEach(file => {
        const card = document.createElement('div');
        card.className = 'grid-item reveal photo-card';

        const thumb = document.createElement('div');
        thumb.className = 'thumb';

        const img = document.createElement('img');
        img.src = `https://raw.githubusercontent.com/ladachka/video-portfolio/main/${file.path}`;
        img.alt = file.name;
        img.loading = 'lazy';

        thumb.appendChild(img);
        card.appendChild(thumb);
        photosGrid.appendChild(card);
        obs.observe(card);
      });
    }

    let photosLoaded = false;
    photosBtn.addEventListener('click', async () => {
      if (!photosLoaded) {
        await loadPhotos();
        photosLoaded = true;
      }
    });
  </script>

</body>
</html>
